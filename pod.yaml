apiVersion: v1
kind: Pod
metadata:
  name: hn-reader
spec:
  containers:
    - name: hn-reader
      image: localhost/hn-reader:latest
      imagePullPolicy: Never
      env:
        - name: NODE_EXTRA_CA_CERTS
          value: /run/host-ca.pem
      ports:
        - containerPort: 4173
          protocol: TCP
      volumeMounts:
        - name: host-ca
          mountPath: /run/host-ca.pem
          readOnly: true
  volumes:
    - name: host-ca
      hostPath:
        path: /home/user/.config/hn-reader/ca-bundle.pem
        type: File
